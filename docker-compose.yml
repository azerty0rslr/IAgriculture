version: '3.8'

services:
  # Base de données MongoDB
  mongodb:
    image: mongo:7
    container_name: agri-ia-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: agri-ia

  # Backend Node.js
  backend:
    build: ./backend
    container_name: agri-ia-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/agri-ia
      - JWT_SECRET=agri_ia_secret_key_change_en_production_2025
      - NODE_ENV=production

  # Frontend React
  frontend:
    build: ./frontend
    container_name: agri-ia-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
